# ============================================
# 可为健康 - Docker Compose 配置
# 用于开发环境和生产部署
# ============================================

services:
  # ---- PostgreSQL 数据库 ----
  postgres:
    image: postgres:16-alpine
    container_name: kewei-postgres
    restart: always
    environment:
      POSTGRES_DB: kewei_health
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: kewei-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- 后端 API 服务 ----
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kewei-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres123}@postgres:5432/kewei_health?schema=public
      JWT_SECRET: ${JWT_SECRET:-kewei-health-jwt-secret-2026}
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      # CORS 允许的前端域名（逗号分隔，部署后改为正式域名）
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # AI 识别：mock=本地模拟；baidu=接入百度OCR（需密钥）
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      BAIDU_API_KEY: ${BAIDU_API_KEY:-}
      BAIDU_SECRET_KEY: ${BAIDU_SECRET_KEY:-}
    volumes:
      - uploads_data:/app/server/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Nginx（Web前端 + 反向代理）----
  nginx:
    image: nginx:alpine
    container_name: kewei-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro  # 部署前本地执行 npm run build -w web
      - ./ssl:/etc/nginx/ssl:ro  # SSL证书（生产环境）
    depends_on:
      - server

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

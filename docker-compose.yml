# ============================================
# 可为健康 - Docker Compose 配置
# 用于开发环境和生产部署
# ============================================

version: '3.8'

services:
  # ---- PostgreSQL 数据库 ----
  postgres:
    image: postgres:16-alpine
    container_name: kewei-postgres
    restart: always
    environment:
      POSTGRES_DB: kewei_health
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: kewei-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- 后端 API 服务 ----
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kewei-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres123}@postgres:5432/kewei_health?schema=public
      JWT_SECRET: ${JWT_SECRET:-kewei-health-jwt-secret-2026}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_ENDPOINT: ${AI_API_ENDPOINT:-https://api.openai.com/v1/chat/completions}
      PORT: 3000
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads_data:/app/server/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Nginx（Web前端 + 反向代理）----
  nginx:
    image: nginx:alpine
    container_name: kewei-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL证书（生产环境）
    depends_on:
      - server

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
